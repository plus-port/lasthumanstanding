# The same gate the agent runs locally (`pnpm gate`), nothing more. Keep them identical.
image: node:22

stages: [gate]

variables:
  PNPM_HOME: /root/.local/share/pnpm

cache:
  key:
    files: [pnpm-lock.yaml]
  paths:
    - .pnpm-store

gate:
  stage: gate
  before_script:
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm gate
  artifacts:
    when: always
    expire_in: 1 week
    paths: [dist/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
